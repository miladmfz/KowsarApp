plugins {
    id 'com.android.application'
}

def releaseStoreFile = System.getenv('KOWSAR_SIGNING_STORE_FILE')
def releaseStorePassword = System.getenv('KOWSAR_SIGNING_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('KOWSAR_SIGNING_KEY_ALIAS')
def releaseKeyPassword = System.getenv('KOWSAR_SIGNING_KEY_PASSWORD')
def hasReleaseSigning = [
        releaseStoreFile,
        releaseStorePassword,
        releaseKeyAlias,
        releaseKeyPassword
].every { value -> value != null && !value.trim().isEmpty() }

def kowsarVersionCode = providers.gradleProperty('KOWSAR_VERSION_CODE')
        .orElse('150606')
        .get()
        .toInteger()
def kowsarVersionName = providers.gradleProperty('KOWSAR_VERSION_NAME')
        .orElse('15.06.06')
        .get()

android {
    namespace 'com.kits.kowsarapp'
    compileSdk 33

    defaultConfig {
        applicationId "com.kits.kowsarapp"
        minSdk 29
        targetSdk 33
        versionCode kowsarVersionCode
        versionName kowsarVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    lint {
        checkReleaseBuilds true
        abortOnError true
        baseline = file('lint-baseline.xml')
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    viewBinding.enabled = true
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}



dependencies {

    // sysdefult
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation files("libs/behThirdparty.aar")
    implementation 'androidx.appcompat:appcompat:1.5.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    implementation 'com.google.android.material:material:1.5.0'

    // component
    implementation 'com.thoughtbot:expandablerecyclerview:1.3'

    implementation 'com.github.smarteist:autoimageslider:1.3.2'
    implementation "androidx.work:work-runtime:2.7.1"
    implementation "androidx.concurrent:concurrent-futures:1.1.0"
    implementation 'com.google.guava:guava:29.0-android'
    implementation 'jp.wasabeef:recyclerview-animators:4.0.2'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'


    //  font and image
    implementation 'uk.co.chrisjenx:calligraphy:2.3.0'
    implementation 'com.github.bumptech.glide:glide:4.13.2'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.13.2'

    // network
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.9.0'


    implementation 'com.squareup.retrofit2:converter-scalars:2.9.0'
    implementation 'com.google.android.gms:play-services-maps:18.1.0'
    // offline
    implementation 'com.github.amitshekhariitbhu:PRDownloader:1.0.1'

    implementation 'com.mohamadamin:persianmaterialdatetimepicker:1.2.1'
    implementation 'com.readystatesoftware.sqliteasset:sqliteassethelper:2.0.1'
    implementation 'me.dm7.barcodescanner:zxing:1.9.8'
    implementation 'com.github.juanlabrador:badgecounter:1.0.2@aar'
    implementation "com.airbnb.android:lottie:5.0.3"
    implementation 'com.google.android.gms:play-services-location:17.0.0'
    implementation 'com.google.gms:google-services:4.3.15'
    implementation 'com.karumi:dexter:4.2.0'

}

tasks.register('verifyReleaseSigningConfiguration') {
    group = 'verification'
    description = 'Fails unless all external Kowsar release-signing environment variables are present.'
    doLast {
        if (!hasReleaseSigning) {
            throw new GradleException('Release signing is not configured. Set KOWSAR_SIGNING_STORE_FILE, KOWSAR_SIGNING_STORE_PASSWORD, KOWSAR_SIGNING_KEY_ALIAS and KOWSAR_SIGNING_KEY_PASSWORD outside the repository.')
        }
        if (!file(releaseStoreFile).isFile()) {
            throw new GradleException('KOWSAR_SIGNING_STORE_FILE does not point to a readable keystore file.')
        }
    }
}
